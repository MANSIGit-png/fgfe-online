name: Assemble clean bot

on:
  push:
    branches: [main]
    paths:
      - 'bac/.bot_upload/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble bot.py
        run: |
          cat bac/.bot_upload/part-* > bac/bot.py
          python -m py_compile bac/bot.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bac/bot.py
          git commit -m "Replace bot payload with clean bot.py" || exit 0
          git push origin main
