name: Import full TONFARM project

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '_import/fgfe-ready.zip.part-*'

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check archive parts
        id: parts
        shell: bash
        run: |
          set -euo pipefail
          ready=true
          for n in 00 01 02 03 04 05 06 07; do
            if [ ! -f "_import/fgfe-ready.zip.part-$n" ]; then
              echo "Waiting for part $n"
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Rebuild and validate archive
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat _import/fgfe-ready.zip.part-* > /tmp/tonfarm_ready.zip
          unzip -tq /tmp/tonfarm_ready.zip >/dev/null
          rm -rf /tmp/tonfarm-import
          mkdir -p /tmp/tonfarm-import
          unzip -q /tmp/tonfarm_ready.zip -d /tmp/tonfarm-import
          test -d /tmp/tonfarm-import/tonfarm_ready/web
          test -d /tmp/tonfarm-import/tonfarm_ready/bac
          test -d /tmp/tonfarm-import/tonfarm_ready/data

      - name: Replace repository with project
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete /tmp/tonfarm-import/tonfarm_ready/ ./ \
            --exclude='.git/' \
            --exclude='_import/' \
            --exclude='.github/workflows/import-tonfarm.yml'
          rm -rf _import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Import full TONFARM project into main"
            git push origin main
          fi
