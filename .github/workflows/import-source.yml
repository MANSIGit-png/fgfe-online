name: Import optimized TONFARM source

on:
  push:
    branches:
      - main
    paths:
      - '.source-upload/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          for n in 00 01 02 03 04 05 06 07; do
            test -f ".source-upload/part-$n"
          done
          cat .source-upload/part-* > /tmp/fgfe-source.b64
          base64 -d /tmp/fgfe-source.b64 > /tmp/fgfe-source.zip
          unzip -q /tmp/fgfe-source.zip -d /tmp/fgfe-source

      - name: Install optimized source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f web/README.md bac/README.md data/README.md locales/README.md
          rsync -a /tmp/fgfe-source/ ./ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.source-upload/'
          rm -rf .source-upload

      - name: Commit source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Import optimized TONFARM source"
          git push origin HEAD:main
