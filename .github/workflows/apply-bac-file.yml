name: Apply BAC file

on:
  push:
    branches: [main]
    paths:
      - 'bac/_*_payload.gz.b64'
      - 'bac/_*_payload.ready'
      - '.github/workflows/apply-bac-file.yml'

permissions:
  contents: write

jobs:
  apply-one-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply one payload
        shell: bash
        run: |
          set -euo pipefail

          payload="$(find bac -maxdepth 1 -name '_*_payload.gz.b64' | sort | head -n 1 || true)"
          ready="$(find bac -maxdepth 1 -name '_*_payload.ready' | sort | head -n 1 || true)"

          if [ -n "$payload" ]; then
            base="$(basename "$payload")"
            target="${base#_}"
            target="${target%_payload.gz.b64}.py"
            base64 -d "$payload" | gzip -d > "bac/$target"
            rm -f "$payload"
          elif [ -n "$ready" ]; then
            base="$(basename "$ready")"
            stem="${base%.ready}"
            target="${stem#_}"
            target="${target%_payload}.py"
            cat "bac/${stem}.gz.b64.part-"* | base64 -d | gzip -d > "bac/$target"
            rm -f "bac/${stem}.gz.b64.part-"* "$ready"
          else
            echo 'No complete payload to apply'
            exit 0
          fi

          python -m py_compile "bac/$target"
          rm -f bac/_tmp_functions_marker.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Apply bac/$target from TONFARM source"
          git push origin HEAD:main
