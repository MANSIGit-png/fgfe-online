name: Assemble bot.py

on:
  push:
    branches: [main]
    paths:
      - 'bac/.bot-transfer/**'
      - '.github/workflows/assemble-bot.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble bot.py when all parts are present
        shell: bash
        run: |
          set -euo pipefail
          for n in 00 01 02 03; do
            test -f "bac/.bot-transfer/bot.py.gz.b64.part-$n" || exit 0
          done
          test -f bac/.bot-transfer/READY || exit 0
          cat bac/.bot-transfer/bot.py.gz.b64.part-* | base64 -d | gzip -d > bac/bot.py
          python -m py_compile bac/bot.py
          rm -rf bac/.bot-transfer
          rm -f .github/workflows/assemble-bot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add refactored bac bot'
          git push origin main
