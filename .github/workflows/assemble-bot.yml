name: Assemble bot.py

on:
  push:
    branches: [main]
    paths:
      - 'bac/_bot_payload.gz.b64.part-*'
      - 'bac/_bot_payload.ready'
      - '.github/workflows/assemble-bot.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble final bac/bot.py
        shell: bash
        run: |
          set -euo pipefail
          test -f bac/_bot_payload.gz.b64.part-00
          test -f bac/_bot_payload.gz.b64.part-01
          cat bac/_bot_payload.gz.b64.part-00 bac/_bot_payload.gz.b64.part-01 | base64 -d | gzip -d > bac/bot.py
          python -m py_compile bac/bot.py
          rm -f bac/_bot_payload.gz.b64.part-00 bac/_bot_payload.gz.b64.part-01 bac/_bot_payload.ready
          rm -rf bac/.transfer
          rm -f .github/workflows/assemble-bot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add cleaned bac bot and remove transfer files'
          git push origin main
