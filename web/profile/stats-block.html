<script>
    (function() {
        function t(key, defaultValue) {
            if (window.translations && window.translations[key]) {
                return window.translations[key];
            }
            return defaultValue;
        }

        function updateTexts() {
            const statsTitle = document.getElementById('statsTitle');
            const turnoverLabel = document.getElementById('turnoverLabel');
            const recordBalanceLabel = document.getElementById('recordBalanceLabel');
            const totalWithdrawnLabel = document.getElementById('totalWithdrawnLabel');

            if (statsTitle) statsTitle.textContent = t('stats', 'Статистика');
            if (turnoverLabel) turnoverLabel.textContent = t('turnover', 'Оборот');
            if (recordBalanceLabel) recordBalanceLabel.textContent = t('recordBalance', 'Рекордный баланс');
            if (totalWithdrawnLabel) totalWithdrawnLabel.textContent = t('totalWithdrawn', 'Всего выведено');
        }

        window.updateStatsTexts = updateTexts;

        function init() {
            updateTexts();

            const header = document.getElementById('statsHeader');
            const content = document.getElementById('statsContent');
            const toggleIcon = document.getElementById('statsToggleIcon');

            if (!header || !content) return;

            const isOpen = localStorage.getItem('statsOpen') === 'true';
            if (isOpen) {
                content.style.display = 'block';
                if (toggleIcon) toggleIcon.style.transform = 'rotate(180deg)';
            } else {
                content.style.display = 'none';
                if (toggleIcon) toggleIcon.style.transform = 'rotate(0deg)';
            }

            header.onclick = function(e) {
                e.stopPropagation();
                if (content.style.display === 'none') {
                    content.style.display = 'block';
                    if (toggleIcon) toggleIcon.style.transform = 'rotate(180deg)';
                    localStorage.setItem('statsOpen', 'true');
                } else {
                    content.style.display = 'none';
                    if (toggleIcon) toggleIcon.style.transform = 'rotate(0deg)';
                    localStorage.setItem('statsOpen', 'false');
                }
            };

            loadStats();

            window.addEventListener('translationsLoaded', updateTexts);
        }

        async function loadStats() {
            const userId = window.telegramUser?.id;
            if (!userId) return;

            try {
                const response = await fetch(`/api/user_stats?user_id=${userId}`);
                const data = await response.json();
                const stats = data.stats || {};

                const turnoverEl = document.getElementById('totalTurnoverValue');
                const recordEl = document.getElementById('recordBalanceValue');
                const withdrawnEl = document.getElementById('totalWithdrawnValue');

                if (turnoverEl) turnoverEl.textContent = formatNumber(stats.total_turnover);
                if (recordEl) recordEl.textContent = formatNumber(stats.record_balance);
                if (withdrawnEl) withdrawnEl.textContent = formatNumber(stats.total_withdrawn);
            } catch(e) {
            }
        }

        function formatNumber(value) {
            const num = parseFloat(value);
            return isNaN(num) ? '0' : num.toFixed(1);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
</script>
