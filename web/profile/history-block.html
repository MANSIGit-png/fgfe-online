<div class="history-section-title-outside">
    <span id="historyTitle">История операций</span>
</div>

<div class="history-section">
    <div id="compactHistory" class="history-compact">
        <div id="compactHistoryList"></div>
        <div class="history-more-btn" id="moreHistoryBtn">...</div>
    </div>
    <div id="fullHistory" class="history-full" style="display: none;">
        <div class="history-list">
            <div id="fullHistoryList"></div>
        </div>
        <div class="pagination-container" id="paginationContainer" style="display: none;">
            <button class="pagination-btn" id="prevPageBtn" disabled>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18L9 12L15 6"/>
                </svg>
            </button>
            <span class="page-info" id="pageInfo">Страница 1 из 1</span>
            <button class="pagination-btn" id="nextPageBtn" disabled>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 18L15 12L9 6"/>
                </svg>
            </button>
        </div>
    </div>
</div>

<style>
    .history-section-title-outside { margin: 0px 0 0 0; padding: 0 4px; }
    .history-section-title-outside span { font-size: 18px; font-weight: 700; color: white; }
    .history-section { margin-top: 16px; background: rgba(213, 174, 212, 0.08); backdrop-filter: blur(12px); border-radius: 20px; overflow: hidden; }
    .history-compact { padding: 12px 16px 16px 16px; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .history-item:first-child { padding-top: 0; }
    .history-item:last-child { border-bottom: none; padding-bottom: 0; }
    .history-left { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .history-desc { font-size: 14px; font-weight: 600; color: #ffffff; }
    .history-date { font-size: 11px; color: #888; }
    .history-right { text-align: right; flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
    .history-amount { font-size: 14px; font-weight: 700; padding: 4px 10px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; }
    .history-amount.positive { background: rgba(16, 185, 129, 0.15); color: #10b981; }
    .history-amount.negative { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
    .history-token-icon { width: 18px; height: 18px; flex-shrink: 0; }
    .history-more-btn { text-align: center; padding: 10px 0 4px 0; font-size: 18px; font-weight: 700; letter-spacing: 2px; color: rgba(255,255,255,0.5); cursor: pointer; transition: all 0.2s; }
    .history-more-btn:active { transform: scale(0.96); color: rgba(255,255,255,0.8); }
    .history-full { padding: 12px 16px 16px 16px; }
    .history-list { max-height: 400px; overflow-y: auto; }
    .empty-history { text-align: center; padding: 30px; color: #888; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .pagination-container { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.08); }
    .pagination-btn { background: rgba(213, 174, 212, 0.15); border: none; border-radius: 40px; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 13px; color: white; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.1s ease; min-width: 70px; }
    .pagination-btn:active { transform: scale(0.96); background: rgba(213, 174, 212, 0.3); }
    .pagination-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .page-info { font-size: 12px; color: rgba(255,255,255,0.6); }
</style>

<script>
    (function() {
        const userId = window.telegramUser?.id;
        let allHistory = [];
        let currentPage = 1;
        const itemsPerPage = 25;

        function getTranslation(key, defaultText) {
            if (window.translations && window.translations[key]) return window.translations[key];
            return defaultText;
        }

        function formatNumber(value) {
            const num = parseFloat(value);
            return isNaN(num) ? '0' : num.toFixed(2);
        }

        function formatLocalDate(dateStr, timeStr) {
            if (!dateStr) return '';
            try {
                let dateTimeStr = dateStr;
                if (timeStr) dateTimeStr = dateStr + ' ' + timeStr;
                const utcDate = new Date(dateTimeStr + 'Z');
                if (isNaN(utcDate.getTime())) return dateStr;
                const options = { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' };
                return utcDate.toLocaleDateString('ru-RU', options);
            } catch (e) {
                return dateStr;
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function getTonIcon() {
            return `<svg width="20" height="20" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8.99754 2.07764C9.52965 2.07764 9.79593 2.07843 10.0366 2.15283C10.2495 2.2187 10.4471 2.32668 10.6177 2.47021C10.8103 2.63237 10.9541 2.85594 11.2417 3.30322L12.5122 5.27881C12.7023 5.57453 12.7969 5.7228 12.8227 5.87842C12.8454 6.01558 12.8311 6.15644 12.7798 6.28564C12.7215 6.43222 12.5967 6.55659 12.3481 6.80518L7.62938 11.5239C7.40924 11.7441 7.2983 11.8548 7.17137 11.896C7.06 11.9321 6.93997 11.9321 6.8286 11.896C6.70168 11.8548 6.59168 11.744 6.37156 11.5239L1.65184 6.80518C1.40336 6.5567 1.27947 6.43214 1.22117 6.28564C1.1698 6.15642 1.15451 6.01561 1.17723 5.87842C1.20303 5.7228 1.29767 5.57453 1.48778 5.27881L2.75828 3.30322C3.0458 2.85597 3.18972 2.63237 3.38231 2.47021C3.5528 2.32671 3.75046 2.2187 3.96336 2.15283C4.20401 2.07843 4.47033 2.07764 5.00242 2.07764H8.99754ZM8.61961 3.63623C8.55461 3.46116 8.30678 3.46125 8.24168 3.63623L7.79246 4.84912C7.7655 4.92165 7.70875 4.9794 7.63621 5.00635L6.42332 5.45459C6.24808 5.51956 6.24807 5.76754 6.42332 5.83252L7.63621 6.28076C7.70876 6.3077 7.76551 6.36545 7.79246 6.43799L8.24168 7.65088C8.3068 7.82582 8.5546 7.82591 8.61961 7.65088L9.06785 6.43799C9.09482 6.36526 9.15233 6.30767 9.22508 6.28076L10.437 5.83252C10.6124 5.7676 10.6124 5.5195 10.437 5.45459L9.22508 5.00635C9.15234 4.97942 9.09482 4.92183 9.06785 4.84912L8.61961 3.63623Z" fill="currentColor"/>
                    </svg>`;
        }

        function renderHistoryItems(items, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const emptyText = getTranslation('emptyHistoryMsg', 'История операций пуста');
            if (!items || items.length === 0) {
                container.innerHTML = `<div class="empty-history"><span>${emptyText}</span></div>`;
                return false;
            }
            let html = '';
            for (const item of items) {
                const amountNum = parseFloat(item.amount);
                const isPositive = amountNum >= 0;
                const absAmount = Math.abs(amountNum);
                const description = item.description || '';
                const isTON = item.token && item.token.toUpperCase() === 'GRAM';
                const localDate = formatLocalDate(item.date, item.time);
                html += `<div class="history-item">
                    <div class="history-left">
                        <div class="history-desc">${escapeHtml(description)}</div>
                        <div class="history-date">${escapeHtml(localDate)}</div>
                    </div>
                    <div class="history-right">
                        ${isTON ? getTonIcon() : ''}
                        <div class="history-amount ${isPositive ? 'positive' : 'negative'}">
                            ${isPositive ? '+' : '-'}${formatNumber(absAmount)}
                        </div>
                    </div>
                </div>`;
            }
            container.innerHTML = html;
            return true;
        }

        function renderFullHistoryPage() {
            const totalPages = Math.ceil(allHistory.length / itemsPerPage);
            const startIdx = (currentPage - 1) * itemsPerPage;
            const pageItems = allHistory.slice(startIdx, startIdx + itemsPerPage);
            renderHistoryItems(pageItems, 'fullHistoryList');
            const paginationContainer = document.getElementById('paginationContainer');
            const prevBtn = document.getElementById('prevPageBtn');
            const nextBtn = document.getElementById('nextPageBtn');
            const pageInfo = document.getElementById('pageInfo');
            paginationContainer.style.display = 'flex';
            const pageText = getTranslation('page', 'Страница');
            const ofText = getTranslation('of', 'из');
            pageInfo.textContent = `${pageText} ${currentPage} ${ofText} ${totalPages}`;
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;
        }

        function goToPrevPage() {
            if (currentPage > 1) { currentPage--; renderFullHistoryPage(); }
        }

        function goToNextPage() {
            const totalPages = Math.ceil(allHistory.length / itemsPerPage);
            if (currentPage < totalPages) { currentPage++; renderFullHistoryPage(); }
        }

        async function loadHistory() {
            if (!userId) return;
            const compactList = document.getElementById('compactHistoryList');
            const loadingText = getTranslation('loading', 'Загрузка...');
            if (compactList) compactList.innerHTML = `<div class="empty-history"><span>${loadingText}</span></div>`;
            try {
                const response = await fetch(`/api/user_history?user_id=${userId}`);
                const data = await response.json();
                allHistory = (data.history || []).reverse();
                const last3 = allHistory.slice(0, 3);
                renderHistoryItems(last3, 'compactHistoryList');
                const moreBtn = document.getElementById('moreHistoryBtn');
                moreBtn.style.display = allHistory.length > 3 ? 'block' : 'none';
                currentPage = 1;
                renderFullHistoryPage();
            } catch (error) {
                const errorText = getTranslation('error', 'Ошибка загрузки');
                if (compactList) compactList.innerHTML = `<div class="empty-history"><span>${errorText}</span></div>`;
            }
        }

        function setupMoreBtn() {
            const moreBtn = document.getElementById('moreHistoryBtn');
            const compactDiv = document.getElementById('compactHistory');
            const fullDiv = document.getElementById('fullHistory');
            if (moreBtn) moreBtn.onclick = function() { compactDiv.style.display = 'none'; fullDiv.style.display = 'block'; };
        }

        function setupPaginationButtons() {
            const prevBtn = document.getElementById('prevPageBtn');
            const nextBtn = document.getElementById('nextPageBtn');
            if (prevBtn) prevBtn.addEventListener('click', goToPrevPage);
            if (nextBtn) nextBtn.addEventListener('click', goToNextPage);
        }

        function updateHistoryTitle() {
            const titleSpan = document.getElementById('historyTitle');
            if (titleSpan) titleSpan.textContent = getTranslation('history', 'История операций');
        }

        window.updateHistoryTitle = updateHistoryTitle;

        function init() {
            updateHistoryTitle();
            setupMoreBtn();
            setupPaginationButtons();
            loadHistory();
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    })();
</script>
